name: twin_project
description: A Flutter project for TWIN.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/TWIN_ico.png
